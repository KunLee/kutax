name: kutax

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kutax
      POSTGRES_USER: kutax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutax -d kutax"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in infra/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4@sha256:7659dcb0db47941d3cf8336af84bbb63c7e70b76fc00601774358412b42ed186
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Local test mail server: catches every email KuTax sends (sharing invitations) and shows it at
  # http://localhost:8025. Nothing leaves this machine. Production uses a real SMTP provider (Email__* settings).
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional local image smoke run. Production requires its own TLS/secret configuration.
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # This local password-based database does not use Kerberos.
      ConnectionStrings__Database: Host=postgres;Database=kutax;Username=kutax;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env};GSS Encryption Mode=Disable
      Storage__Endpoint: http://rustfs:9000
      Storage__AccessKey: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in infra/.env}
      Storage__SecretKey: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in infra/.env}
      Scanning__Host: clamav
      Registration__Enabled: "true"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__Security: None
      Email__From: kutax@localhost.test
      # Optional AI extraction. Off unless configured in infra/.env; each user must also consent in Settings.
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__Provider: ${AI_PROVIDER:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__TextModel: ${AI_TEXT_MODEL:-}
      Ai__Region: ${AI_REGION:-}
      Ai__RetentionNotice: ${AI_RETENTION_NOTICE:-}
      DevelopmentSeed__Password: ${DEVELOPMENT_SEED_PASSWORD:?Set DEVELOPMENT_SEED_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - app-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
  app-keys:
  clamav-data:
